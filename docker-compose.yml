services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessgov
      POSTGRES_USER: accessgov
      POSTGRES_PASSWORD: accessgov
    volumes:
      - accessgov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessgov -d accessgov"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://accessgov:accessgov@db:5432/accessgov
      CORS_ORIGINS: "*"
      DORMANT_DAYS: "90"
      EXCESSIVE_ENTITLEMENT_THRESHOLD: "8"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  accessgov_pgdata:
